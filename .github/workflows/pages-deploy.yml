name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Notes dated today go live with this morning build (08:02 in Amsterdam in winter,
  # 09:02 in summer). Off the full hour, where GitHub delays scheduled runs the most.
  schedule:
    - cron: "2 7 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Type check, build tests, production build and browser tests. A failure stops the deploy.
      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # The deploy step can report success while the site does not answer. Ask the site itself:
      # the homepage, and the script that clears the old site's cache from returning browsers.
      - name: Check that the live site answers
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for page in "" "sw.min.js" "feed.xml"; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
              --output /dev/null "${SITE%/}/${page}"
            echo "ok ${SITE%/}/${page}"
          done
