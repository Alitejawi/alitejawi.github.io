name: "Daily Espressos"

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Increment espressos counter
        run: node scripts/bump-espresso.mjs

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "Ali Al-Itejawi"
          git config user.email "ali@itejawi.com"
          git add src/data/espresso.json
          git commit -m "Daily espressos +2"
          git push

      - name: Trigger pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
