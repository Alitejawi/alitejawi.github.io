name: "Daily Espressos"

on:
  schedule:
    # Off the full hour: GitHub starts runs scheduled for :00 hours late. Even so, runs have
    # landed up to ten hours late; the script counts by date, so a late run is still right.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One run at a time: a manual run waits for the scheduled one instead of racing it.
concurrency:
  group: daily-espressos
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The tip of main when the run starts, so a run that waited sees the last run's count.
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # 1-2 random rest days a week, the same days brain-sync rests (scripts/rest-day.mjs).
      # No commit on a rest day; the next work day adds the days since the last counted one.
      - name: Rest day check
        id: rest
        run: |
          kind=$(node scripts/rest-day.mjs)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "$kind day"

      # Adds 3 for every UTC day after the last counted day in src/data/espresso.json, up to
      # today. A repeated run adds 0; a run after a failed one adds the missed days.
      - name: Increment espressos counter
        id: bump
        if: steps.rest.outputs.kind == 'work'
        run: |
          added=$(node scripts/bump-espresso.mjs)
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "added $added"

      - name: Commit and push
        if: steps.bump.outputs.added && steps.bump.outputs.added != '0'
        env:
          ADDED: ${{ steps.bump.outputs.added }}
        run: |
          git config user.name "Ali Al-Itejawi"
          git config user.email "ali@itejawi.com"
          git add src/data/espresso.json
          git commit -m "Daily espressos +$ADDED"
          git push

      - name: Trigger pages deploy
        if: steps.bump.outputs.added && steps.bump.outputs.added != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
