name: Build and test the site
description: >
  Installs, type-checks, builds and tests the site, including the browser tests.
  Leaves the production build in dist/. Used by the deploy and the pull-request check,
  so both run exactly the same steps.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Type check
      shell: bash
      run: npm run check

    - name: Build tests
      shell: bash
      run: npm test

    # A clean production build: this is the copy the browser tests read and the deploy uploads.
    - name: Build site
      shell: bash
      run: npm run build

    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the test browser
      id: browser
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install the test browser
      if: steps.browser.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # A restored browser still needs its system libraries.
    - name: Install the test browser's system libraries
      if: steps.browser.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium

    - name: Browser tests
      shell: bash
      run: npm run test:e2e

    - name: Keep the browser traces of failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: browser-test-traces
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore
